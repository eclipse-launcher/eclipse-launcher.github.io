<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071316">
    <title>Eclipse Client</title>
    <meta name="description" content="Eclipse Client — a Minecraft client made for your next adventure.">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <style>
        * { box-sizing: border-box; }

        html, body { width: 100%; min-height: 100%; margin: 0; }

        body {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background-color: #071316;
            background-image: linear-gradient(rgba(0, 10, 13, 0.24), rgba(0, 8, 12, 0.34)), url("eclipse-minecraft-wallpaper.jpg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        main {
            display: grid;
            place-items: center;
            align-content: center;
            gap: 8px;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            padding: 32px;
        }

        img {
            display: block;
            width: min( min(72vw, 460px), 52vh );
            width: min(72vw, 460px, 52svh);
            height: auto;
            margin-bottom: -142px;
            filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.32));
            animation: logo-arrive 850ms cubic-bezier(.2,.75,.25,1) both;
        }

        h1 {
            margin: 0 0 2px;
            color: #fff;
            font: 750 clamp(1.05rem, 2vw, 1.4rem)/1.25 "Segoe UI", Arial, sans-serif;
            letter-spacing: 0.015em;
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            animation: fade-up 650ms 120ms ease-out both;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 174px;
            min-height: 48px;
            padding: 0 22px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 7px;
            color: #fff;
            font: 750 0.9rem/1 "Segoe UI", Arial, sans-serif;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.22);
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease, border-color 180ms ease;
            animation: fade-up 650ms 220ms ease-out both;
        }

        .download { background: linear-gradient(135deg, #b357c5, #9145b4); }
        .take-a-look { background: linear-gradient(135deg, #439fbd, #347eaa); }

        .action-button:hover {
            translate: 0 -4px;
            filter: brightness(1.12);
            border-color: rgba(255, 255, 255, 0.58);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34), 0 0 20px rgba(163, 102, 218, 0.3);
        }

        .action-button:active {
            translate: 0 -1px;
            scale: 0.97;
            filter: brightness(0.96);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.28);
        }

        .action-button:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }

        .arrow-mark { transition: transform 180ms ease; }
        .take-a-look:hover .arrow-mark { transform: translateX(4px); }

        .windows-mark {
            display: grid;
            grid-template-columns: repeat(2, 7px);
            grid-template-rows: repeat(2, 7px);
            gap: 2px;
            transform: skewY(-7deg);
        }

        .windows-mark span { background: currentColor; }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes logo-arrive {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 600px) {
            main { padding: 20px; }
            img { width: min(82vw, 420px, 48svh); margin-bottom: -100px; }
            .actions { gap: 10px; }
            .action-button { min-width: 158px; padding-inline: 16px; font-size: 0.84rem; }
        }
    </style>
</head>
<body>
    <main aria-label="Eclipse Client">
        <img src="eclipselogo_namenobackground.png" alt="Eclipse">
        <h1>The Coolest Minecraft Launcher</h1>
        <div class="actions" aria-label="Coming soon">
            <button class="action-button download" type="button">
                <span class="windows-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
                Download for
            </button>
            <button class="action-button take-a-look" type="button">
                Take a look
                <svg class="arrow-mark" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4.5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </main>
</body>
</html>

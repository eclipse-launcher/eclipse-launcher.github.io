<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071316">
    <title>Eclipse Client | The coolest Minecraft launcher</title>
    <meta name="description" content="Eclipse Client is an all-in-one Minecraft Launcher and Client that enables users to boost their FPS, manage multiple Microsoft or offline accounts, create custom game instances, and fully customize their interface and gameplay experience.">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <script src="/analytics.js" defer></script>
    <style>
        * { box-sizing: border-box; }

        html, body { width: 100%; min-height: 100%; margin: 0; }

        body {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background-color: #071316;
            background-image: linear-gradient(rgba(0, 10, 13, 0.24), rgba(0, 8, 12, 0.34)), url("eclipse-minecraft-wallpaper.jpg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .topbar {
            position: fixed;
            z-index: 5;
            top: 18px;
            left: 50%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
            width: min(1060px, calc(100% - 64px));
            min-height: 64px;
            padding: 8px 12px 8px 22px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            background: rgba(13, 15, 22, 0.48);
            -webkit-backdrop-filter: blur(18px) saturate(135%);
            backdrop-filter: blur(18px) saturate(135%);
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.24), inset 0 1px rgba(255, 255, 255, 0.08);
            translate: -50% 0;
            animation: fade-in 900ms ease-out both;
        }

        .nav-brand { display: flex; flex: 0 0 auto; align-items: center; }
        .nav-brand img { display: block; width: 132px; height: auto; }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2.2vw, 30px);
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.78);
            font: 400 0.92rem/1 "Segoe UI", Arial, sans-serif;
            text-decoration: none;
            white-space: nowrap;
            transition: color 220ms ease;
        }

        .nav-links a:hover, .nav-links a:focus-visible { color: #fff; }
        .nav-links a { padding: 10px 16px; border: 1px solid transparent; border-radius: 999px; transition: color 220ms ease, background 220ms ease, border-color 220ms ease, box-shadow 220ms ease; }
        .nav-links a:hover, .nav-links a:focus-visible { border-color: rgba(255,255,255,.28); background: linear-gradient(180deg,rgba(255,255,255,.19),rgba(255,255,255,.07)); box-shadow: inset 0 1px rgba(255,255,255,.15); }
        .nav-links a[aria-current="page"] { padding: 10px 16px; border: 1px solid rgba(255,255,255,.32); border-radius: 999px; background: linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08)); color:#fff; box-shadow:inset 0 1px rgba(255,255,255,.18),0 2px 12px rgba(0,0,0,.18); }

        .nav-download {
            flex: 0 0 auto;
            padding: 11px 22px;
            border: 1px solid rgba(255, 255, 255, 0.68);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.94);
            color: #17151c;
            font: 600 0.9rem/1 "Segoe UI", Arial, sans-serif;
            text-decoration: none;
            white-space: nowrap;
            transition: background 250ms ease, transform 250ms ease, box-shadow 250ms ease;
        }

        .nav-download:hover { transform: translateY(-2px); background: #fff; box-shadow: 0 5px 20px rgba(255, 255, 255, 0.22); }
        .nav-download:focus-visible, .nav-links a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 4px; }

        main {
            display: grid;
            place-items: center;
            align-content: center;
            gap: 8px;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            padding: 32px;
        }

        .hero-logo {
            display: block;
            width: min(72vw, 346px, 45svh);
            height: auto;
            filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.32));
            animation: fade-in 1200ms ease-out both;
        }

        h1 {
            margin: 4px 0 2px;
            color: rgba(255, 255, 255, 0.86);
            font: 400 clamp(0.95rem, 1.6vw, 1.15rem)/1.45 "Segoe UI", Arial, sans-serif;
            letter-spacing: 0.01em;
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            animation: fade-up 1000ms 450ms ease-out both;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 174px;
            min-height: 48px;
            padding: 0 22px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 7px;
            color: #fff;
            font: 750 0.9rem/1 "Segoe UI", Arial, sans-serif;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.22);
            cursor: pointer;
            text-decoration: none;
            transition: translate 650ms cubic-bezier(.2,.75,.25,1), scale 650ms cubic-bezier(.2,.75,.25,1), box-shadow 650ms ease, filter 650ms ease, border-color 650ms ease;
            animation: fade-up 1000ms 850ms ease-out both;
        }

        .download { background: linear-gradient(135deg, #b357c5, #9145b4); }
        .take-a-look { background: linear-gradient(135deg, #439fbd, #347eaa); }

        .action-button:hover {
            translate: 0 -4px;
            filter: brightness(1.12);
            border-color: rgba(255, 255, 255, 0.58);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34), 0 0 20px rgba(163, 102, 218, 0.3);
        }

        .action-button:active {
            translate: 0 -1px;
            scale: 0.97;
            filter: brightness(0.96);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.28);
        }

        .action-button:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }

        .arrow-mark { transition: transform 650ms cubic-bezier(.2,.75,.25,1); }
        .take-a-look:hover .arrow-mark { transform: translateX(4px); }

        .windows-mark {
            display: grid;
            grid-template-columns: repeat(2, 7px);
            grid-template-rows: repeat(2, 7px);
            gap: 2px;
            transform: skewY(-7deg);
        }

        .windows-mark span { background: currentColor; }

        .site-note {
            position: fixed;
            z-index: 2;
            right: 16px;
            bottom: 14px;
            left: 16px;
            color: rgba(255, 255, 255, 0.76);
            font: 400 0.86rem/1.5 "Segoe UI", Arial, sans-serif;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            animation: fade-up 900ms 1100ms ease-out both;
        }

        .site-note a { color: #fff; text-underline-offset: 3px; }
        .site-note a:hover { color: #e4c4ff; }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .topbar {
                top: 10px;
                width: calc(100% - 24px);
                min-height: 0;
                padding: 9px 12px;
                border-radius: 22px;
                flex-wrap: wrap;
                gap: 10px;
            }
            .nav-brand img { width: 108px; }
            .nav-download { padding: 10px 16px; font-size: 0.82rem; }
            .nav-links { order: 3; width: 100%; justify-content: space-between; gap: 8px; padding: 5px 2px 2px; }
            .nav-links a { font-size: 0.78rem; }
            main { padding: 20px; }
            .hero-logo { width: min(78vw, 346px, 40svh); }
            .actions { gap: 10px; }
            .action-button { min-width: 158px; padding-inline: 16px; font-size: 0.84rem; }
        }
    </style>
    <link rel="stylesheet" href="/navigation.css">
</head>
<body>
    <header class="topbar" aria-label="Main navigation">
        <a class="nav-brand" href="/" aria-label="Eclipse home">
            <img src="EclipseLogo+Name397x165.png" alt="Eclipse">
        </a>
        <nav class="nav-links" aria-label="Main menu">
            <a href="/features/">Features</a>
            <a href="#changelog">Changelog</a>
            <a href="/faq/">FAQ</a>
            <a href="https://discord.gg/acwwts2SWt" target="_blank" rel="noopener noreferrer">Discord</a>
        </nav>
        <a class="nav-download" href="#download">Download</a>
    </header>
    <main id="home" aria-label="Eclipse Client">
        <img class="hero-logo" src="eclipselogo_namenobackground346x346.png" alt="Eclipse">
        <h1>The Coolest Minecraft Launcher</h1>
        <div class="actions" aria-label="Coming soon">
            <button class="action-button download" type="button">
                <span class="windows-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
                Download
            </button>
            <a class="action-button take-a-look" href="/look/">
                Take a look
                <svg class="arrow-mark" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4.5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </div>
    </main>
    <footer class="site-note">
        This project is ongoing and isn’t finished yet. <a href="https://discord.gg/acwwts2SWt" target="_blank" rel="noopener noreferrer">Join our Discord</a> for more information.
    </footer>
</body>
</html>

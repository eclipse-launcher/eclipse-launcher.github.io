<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon link -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- SEO Optimization -->
    <title>Eclipse Client - Free Minecraft 1.20.1 PvP Client</title>
    <meta name="description" content="Eclipse Client is a free, open-source Minecraft client featuring FPS boosts, custom mod support, and cracked account support.">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Smooth subtle corner glow using pure black (#000000) and gold (#ffb703) */
            background: radial-gradient(ellipse at 100% 0%, rgba(255, 183, 3, 0.25) 0%, rgba(0, 0, 0, 0) 50%), #000000;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 8%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .logo img {
            width: 32px;
            height: 32px;
        }

        nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #ffb703;
        }

        /* Hero Section Layout */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 8%;
            flex-grow: 1;
            gap: 40px;
        }

        .hero-left {
            max-width: 500px;
        }

        .hero-left h1 {
            font-size: 3.8rem;
            line-height: 1.05;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Feature Bullet List */
        .features-list {
            list-style: none;
            margin-bottom: 35px;
        }

        .features-list li {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .features-list li::before {
            content: "✓";
            color: #ffb703;
            font-weight: 900;
            font-size: 1.3rem;
        }

        /* Action Buttons */
        .btn-gold {
            background-color: #ffb703;
            color: #000000;
            font-weight: 800;
            font-size: 1rem;
            padding: 16px 32px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-gold:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Launcher Showcase Box */
        .hero-right {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .preview-box {
            border: 2px solid #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            max-width: 600px;
            width: 100%;
        }

        .preview-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }

            .hero-left {
                max-width: 100%;
            }

            .features-list li {
                justify-content: center;
            }

            .hero-left h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="Eclipse Icon">
            <span>ECLIPSE CLIENT</span>
        </div>
        <nav>
            <a href="#features">FEATURES</a>
            <a href="#screenshots">SCREENSHOTS</a>
            <a href="https://discord.gg/yourlink" target="_blank">DISCORD</a>
        </nav>
    </header>

    <!-- Main Content Section -->
    <main class="hero">
        <div class="hero-left">
            <h1>THE COOLEST MINECRAFT LAUNCHER</h1>
            
            <ul class="features-list">
                <li>Add OWN mods</li>
                <li>FPS Boost</li>
                <li>Cracked</li>
                <li>Open-Source</li>
            </ul>

            <!-- Gold Download Button -->
            <a href="your-download-link-here.exe" class="btn-gold">
                DOWNLOAD NOW
            </a>
        </div>

        <!-- Client Preview Box -->
        <div class="hero-right">
            <div class="preview-box">
                <img src="launcher-preview.png" alt="Eclipse Launcher Screenshot">
            </div>
        </div>
    </main>

</body>
</html>
